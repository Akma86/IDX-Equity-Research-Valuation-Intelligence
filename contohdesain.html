<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ICBP Equity Research Terminal | Neumorphic Soft UI</title>
    <!-- Google Fonts: Inter (UI/Typography) + JetBrains Mono (Financial Tabular Data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root {
            /* Neumorphic Base Canvas */
            --nm-bg: #E2E8F0;
            --nm-bg-light: #EEF3F8;
            --nm-bg-dark: #D4DCE6;
            
            /* Neumorphic Dual Shadows (Light Top-Left, Dark Bottom-Right) */
            --nm-raised: 6px 6px 14px rgba(163, 177, 198, 0.6), -6px -6px 14px rgba(255, 255, 255, 0.9);
            --nm-raised-sm: 4px 4px 9px rgba(163, 177, 198, 0.55), -4px -4px 9px rgba(255, 255, 255, 0.85);
            --nm-raised-lg: 8px 8px 20px rgba(163, 177, 198, 0.65), -8px -8px 20px rgba(255, 255, 255, 0.95);
            --nm-inset: inset 3px 3px 7px rgba(163, 177, 198, 0.65), inset -3px -3px 7px rgba(255, 255, 255, 0.95);
            --nm-inset-sm: inset 2px 2px 5px rgba(163, 177, 198, 0.6), inset -2px -2px 5px rgba(255, 255, 255, 0.9);
            
            /* Typography & High Contrast (WCAG AA Compliance) */
            --text-main: #0F172A;
            --text-secondary: #334155;
            --text-muted: #64748B;
            
            /* Accents */
            --teal: #0D9488;
            --teal-light: #CCFBF1;
            --teal-dark: #0F766E;
            --blue: #2563EB;
            --blue-light: #DBEAFE;
            --amber: #D97706;
            --amber-light: #FEF3C7;
            --red: #DC2626;
            --red-light: #FEE2E2;
            --purple: #7C3AED;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--nm-bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13.5px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3 {
            color: var(--text-main);
            letter-spacing: -0.02em;
            font-weight: 700;
        }

        h1 { font-size: 1.45rem; line-height: 1.25; }
        h2 { font-size: 1.12rem; margin-top: 22px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        h3 { font-size: 0.95rem; margin-top: 14px; margin-bottom: 6px; }

        #app {
            display: flex;
            min-height: 100vh;
        }

        /* Neumorphic Sidebar */
        #side {
            width: 280px;
            background: var(--nm-bg);
            box-shadow: 4px 0 16px rgba(163, 177, 198, 0.45);
            padding: 20px 16px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        .side-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(163, 177, 198, 0.4);
        }

        .co-badge {
            background: var(--nm-bg);
            color: var(--teal-dark);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            font-weight: 800;
            padding: 7px 11px;
            border-radius: 10px;
            box-shadow: var(--nm-raised-sm);
            border: 1px solid rgba(255, 255, 255, 0.6);
            letter-spacing: 0.04em;
        }

        .side-title {
            font-size: 0.96rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }

        .side-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        #main {
            flex: 1;
            padding: 20px 28px;
            max-width: 1580px;
            min-width: 0;
        }

        /* Top Institutional Header Ribbon */
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px 18px;
            background: var(--nm-bg);
            border-radius: 14px;
            box-shadow: var(--nm-raised-sm);
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header-main {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .terminal-brand-icon {
            width: 42px;
            height: 42px;
            background: var(--nm-bg);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--teal-dark);
            box-shadow: var(--nm-raised-sm);
            border: 1px solid rgba(255, 255, 255, 0.6);
            flex-shrink: 0;
        }

        .header-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .header-meta b {
            color: var(--text-secondary);
        }

        .meta-dot {
            color: var(--text-muted);
            font-weight: bold;
        }

        .market-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--nm-bg);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            box-shadow: var(--nm-inset-sm);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
        }

        /* Neumorphic Metric Cards (.met) */
        .met {
            background: var(--nm-bg);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: var(--nm-raised);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 180ms ease, box-shadow 180ms ease;
            position: relative;
        }

        .met:hover {
            transform: translateY(-2px);
            box-shadow: var(--nm-raised-lg);
        }

        .met .l {
            color: var(--text-muted);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 700;
        }

        .met .v {
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.30rem;
            font-weight: 700;
            margin-top: 3px;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        .met .d {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .arr {
            font-size: 0.70rem;
        }

        .up {
            color: var(--teal) !important;
        }

        .dn {
            color: var(--red) !important;
        }

        /* Grids */
        .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .g5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        .g6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .g21 { display: grid; grid-template-columns: 2.3fr 1fr; gap: 18px; }

        @media(max-width: 1024px) {
            #app { flex-direction: column; }
            #side { width: 100%; height: auto; position: static; box-shadow: 0 4px 12px rgba(163, 177, 198, 0.4); }
            .g2, .g3, .g4, .g5, .g6, .g21 { grid-template-columns: 1fr 1fr; }
        }
        @media(max-width: 640px) {
            .g2, .g3, .g4, .g5, .g6, .g21 { grid-template-columns: 1fr; }
        }

        /* Neumorphic Segmental Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 14px 0 18px;
            padding: 6px;
            background: var(--nm-bg);
            border-radius: 14px;
            box-shadow: var(--nm-inset-sm);
            overflow-x: auto;
        }

        .tabs button {
            background: var(--nm-bg);
            border: none;
            color: var(--text-muted);
            padding: 9px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.84rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 160ms ease;
            user-select: none;
        }

        .tabs button:hover {
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .tabs button.on {
            background: var(--nm-bg);
            color: var(--teal);
            font-weight: 700;
            box-shadow: var(--nm-raised-sm);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .tabs button.on svg {
            stroke: var(--teal) !important;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 14px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.06em;
            font-size: 0.95rem;
            box-shadow: var(--nm-raised-sm);
        }

        .BUY {
            background: var(--nm-bg);
            color: var(--teal-dark);
            border: 1px solid rgba(13, 148, 136, 0.35);
        }

        .HOLD {
            background: var(--nm-bg);
            color: var(--amber);
            border: 1px solid rgba(217, 119, 6, 0.35);
        }

        .SELL {
            background: var(--nm-bg);
            color: var(--red);
            border: 1px solid rgba(220, 38, 38, 0.35);
        }

        /* Neumorphic Risk Cards */
        .risk {
            background: var(--nm-bg);
            border-radius: 14px;
            padding: 16px;
            min-height: 190px;
            box-shadow: var(--nm-raised);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 180ms ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .risk:hover {
            transform: translateY(-2px);
            box-shadow: var(--nm-raised-lg);
        }

        .risk .h {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            font-size: 0.92rem;
        }

        .risk .t {
            font-size: 0.68rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.04em;
            box-shadow: var(--nm-raised-sm);
        }

        .risk p {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin: 4px 0;
            line-height: 1.45;
        }

        .risk .i {
            color: var(--amber);
            font-weight: 600;
            background: rgba(217, 119, 6, 0.08);
            padding: 5px 9px;
            border-radius: 6px;
            border-left: 3px solid var(--amber);
        }

        .note {
            color: var(--text-muted);
            font-size: 0.76rem;
            line-height: 1.4;
        }

        /* Neumorphic Table Styling */
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 0.82rem;
        }

        th, td {
            padding: 7px 12px;
            border-bottom: 1px solid rgba(163, 177, 198, 0.35);
            text-align: right;
            white-space: nowrap;
            color: #1E293B;
            font-variant-numeric: tabular-nums;
        }

        th:first-child, td:first-child {
            text-align: left;
            font-weight: 500;
        }

        th {
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.70rem;
            letter-spacing: 0.05em;
            background: rgba(163, 177, 198, 0.2);
            border-bottom: 1px solid rgba(163, 177, 198, 0.5);
        }

        tbody tr:hover td {
            background: rgba(255, 255, 255, 0.35);
        }

        tr.hl td {
            background: rgba(13, 148, 136, 0.12);
            color: var(--teal-dark);
            font-weight: 700;
            border-top: 1px solid rgba(13, 148, 136, 0.3);
            border-bottom: 1px solid rgba(13, 148, 136, 0.3);
        }

        .box {
            background: var(--nm-bg);
            border-radius: 14px;
            padding: 16px 18px;
            overflow: auto;
            box-shadow: var(--nm-raised);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .sl {
            margin: 10px 0;
        }

        .sl label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .sl label span {
            font-family: 'JetBrains Mono', monospace;
            color: var(--teal-dark);
            font-weight: 700;
            background: var(--nm-bg);
            padding: 1px 6px;
            border-radius: 4px;
            box-shadow: var(--nm-inset-sm);
        }

        /* Neumorphic Sliders */
        input[type=range] {
            width: 100%;
            height: 6px;
            accent-color: var(--teal);
            cursor: pointer;
            background: var(--nm-bg);
            border-radius: 10px;
            box-shadow: var(--nm-inset-sm);
            outline: none;
        }

        /* Neumorphic Buttons */
        button.btn, select {
            background: var(--nm-bg);
            color: var(--text-main);
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: var(--nm-raised-sm);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 160ms ease;
        }

        button.btn:hover {
            color: var(--teal-dark);
            transform: translateY(-1px);
            box-shadow: var(--nm-raised);
        }

        button.btn:active {
            transform: translateY(0);
            box-shadow: var(--nm-inset-sm);
        }

        .seg {
            display: flex;
            gap: 4px;
            margin: 6px 0;
            background: var(--nm-bg);
            padding: 4px;
            border-radius: 10px;
            box-shadow: var(--nm-inset-sm);
        }

        .seg button {
            flex: 1;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: 7px;
            padding: 6px 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.78rem;
            transition: all 140ms ease;
        }

        .seg button.on {
            background: var(--nm-bg);
            color: var(--teal-dark);
            font-weight: 700;
            box-shadow: var(--nm-raised-sm);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        pre {
            background: var(--nm-bg);
            border-radius: 10px;
            padding: 14px;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 0.78rem;
            max-height: 420px;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            box-shadow: var(--nm-inset-sm);
            border: none;
        }

        .ok { color: var(--teal); font-weight: 700; }
        .bad { color: var(--red); font-weight: 700; }
    </style>
</head>

<body>
    <div id="app">
        <aside id="side"></aside>
        <main id="main">
            <header class="terminal-header">
                <div class="header-main">
                    <div class="terminal-brand-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                    </div>
                    <div>
                        <h1>ICBP Equity Research &amp; Valuation Terminal</h1>
                        <div class="header-meta">
                            <span><b>Entity:</b> PT Indofood CBP Sukses Makmur Tbk</span>
                            <span class="meta-dot">•</span>
                            <span><b>Exchange:</b> IDX: ICBP.JK</span>
                            <span class="meta-dot">•</span>
                            <span><b>Sector:</b> Consumer Staples / Food &amp; Beverage</span>
                            <span class="meta-dot">•</span>
                            <span><b>Style:</b> Neumorphic Soft UI</span>
                        </div>
                    </div>
                </div>
                <div class="market-pill">
                    <span class="pulse-dot"></span> REGULAR SESSION (CLOSED)
                </div>
            </header>

            <nav class="tabs" id="tabs"></nav>
            <section id="t0"></section>
            <section id="t1" hidden></section>
            <section id="t2" hidden></section>
            <section id="t3" hidden></section>
            <section id="t4" hidden></section>
            <section id="t5" hidden></section>
        </main>
    </div>

    <script>
        /* ========================= UTILITIES & THEME ========================= */
        const C = { teal: '#0D9488', blue: '#2563EB', amber: '#D97706', red: '#DC2626' };
        const PAL = [C.teal, C.blue, C.amber, C.red, '#7C3AED', '#64748B'];
        const $ = id => document.getElementById(id);
        const sum = a => a.reduce((x, y) => x + y, 0);
        const fmt = (v, d = 0) => Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
        const idr = v => Math.abs(v) >= 1000 ? 'IDR ' + fmt(v / 1000, 1) + 'T' : 'IDR ' + fmt(v) + 'B';
        const pct = (v, d = 1) => (v * 100).toFixed(d) + '%';
        const spct = (v, d = 1) => (v >= 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
        const cagr = (a, b, n) => Math.pow(b / a, 1 / n) - 1;
        
        function met(l, v, d, cls) {
            let arrow = '';
            if (cls === 'up' && d && !d.includes('▲')) arrow = '<span class="arr up">▲</span> ';
            else if (cls === 'dn' && d && !d.includes('▼')) arrow = '<span class="arr dn">▼</span> ';
            return `<div class="met"><div class="l">${l}</div><div class="v">${v}</div><div class="d ${cls || ''}">${arrow}${d || '&nbsp;'}</div></div>`;
        }
        const dcls = x => x >= 0 ? 'up' : 'dn';

        function L(o = {}) {
            const b = {
                paper_bgcolor: '#E2E8F0', plot_bgcolor: '#E2E8F0',
                font: { family: 'Inter, -apple-system, sans-serif', color: '#334155', size: 11.5 },
                margin: { l: 55, r: 25, t: 46, b: 38 },
                legend: { orientation: 'h', y: 1.14, font: { size: 11 } },
                xaxis: { gridcolor: 'rgba(163, 177, 198, 0.35)', linecolor: 'rgba(163, 177, 198, 0.6)', zeroline: false },
                yaxis: { gridcolor: 'rgba(163, 177, 198, 0.35)', linecolor: 'rgba(163, 177, 198, 0.6)', zeroline: false },
                hovermode: 'x unified',
                hoverlabel: { bgcolor: '#0F172A', font: { color: '#F8FAFC', family: 'JetBrains Mono, monospace', size: 11.5 }, bordercolor: '#0F172A' }
            };
            for (const k in o) {
                if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]) && b[k] && typeof b[k] === 'object') {
                    b[k] = { ...b[k], ...o[k] };
                } else {
                    b[k] = o[k];
                }
            }
            return b;
        }

        const P = (id, d, l) => Plotly.react(id, d, L(l), { displayModeBar: false, responsive: true });
        const T = t => ({ text: t, font: { size: 13, color: '#0F172A', family: 'Inter, sans-serif' } });
        function download(name, text, mime) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; a.click(); }

        /* Neumorphic Sparkline with Gradient Fill and Endpoint Glow */
        function spark(a) {
            const w = 84, h = 22, mn = Math.min(...a), mx = Math.max(...a), r = mx - mn || 1;
            const pts = a.map((v, i) => ({
                x: +(i / (a.length - 1) * (w - 8) + 4).toFixed(1),
                y: +(h - 3 - (v - mn) / r * (h - 6)).toFixed(1)
            }));
            const pStr = pts.map(pt => `${pt.x},${pt.y}`).join(' ');
            const last = pts[pts.length - 1];
            const isUp = a[a.length - 1] >= a[0];
            const color = isUp ? '#0D9488' : '#DC2626';
            const polyFill = `${pts[0].x},${h} ${pStr} ${last.x},${h}`;
            return `<svg width="${w}" height="${h}" style="overflow:visible">
                <polygon points="${polyFill}" fill="${color}" fill-opacity="0.16"/>
                <polyline points="${pStr}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="${last.x}" cy="${last.y}" r="2.5" fill="${color}" stroke="#FFFFFF" stroke-width="1.2"/>
            </svg>`;
        }

        function polyfit(x, y) {
            const n = x.length, mx = sum(x) / n, my = sum(y) / n; let sxy = 0, sxx = 0, syy = 0;
            for (let i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2; }
            const s = sxy / sxx; return { slope: s, icpt: my - s * mx, r2: sxy * sxy / (sxx * syy) };
        }
        function quant(a, q) { const s = [...a].sort((x, y) => x - y), p = (s.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return s[lo] + (s[hi] - s[lo]) * (p - lo); }
        const median = a => quant(a, .5);

        /* ========================= SYNTHETIC DATA ========================= */
        const FY = [2021, 2022, 2023, 2024, 2025], TAX = .22, MIN = .14, PAYOUT = .45, SH = 11661.9, SHB = SH / 1000, NCI_FV = 1.5;

        /* ========================= TAB 4: TECHNICALS & MACRO ========================= */
        let lb = 252, mxBuilt = false; const MS = { fx: 0, wheat: 0, cpo: 0, bi: 0, infl: 0, pt: 35 };
        function renderT4() {
            if (!mxBuilt) {
                $('t4').innerHTML = `<h2>Stock Price Technicals &amp; Momentum Engine</h2>
                <div class="seg" style="max-width:380px">${[['3M', 63], ['6M', 126], ['1Y', 252], ['2Y', 504], ['Max', 1000]].map(([l, n]) => `<button class="${n === lb ? 'on' : ''}" onclick="lb=${n};drawTech();this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${l}</button>`).join('')}</div>

            drawMacro();

        function drawTech() {
            const n = lb, s = PX.date.length - n, sl = a => a.slice(s), i = PX.close.length - 1, last = PX.close[i];

            $('techM').innerHTML = met('Last Close Price', fmt(last), spct(last / PX.close[i - 1] - 1, 2), dcls(last - PX.close[i - 1]))

            const x = sl(PX.date), vc = sl(PX.close).map((c, k) => c >= sl(PX.open)[k] ? C.teal : C.red);
            Plotly.react('tc', [
                { type: 'candlestick', x, open: sl(PX.open), high: sl(PX.high), low: sl(PX.low), close: sl(PX.close), name: 'ICBP', increasing: { line: { color: C.teal }, fillcolor: C.teal }, decreasing: { line: { color: C.red }, fillcolor: C.red } },

                yaxis2: { domain: [.36, .48], gridcolor: 'rgba(163,177,198,0.3)', title: 'Volume' },
                yaxis3: { domain: [.18, .34], range: [0, 100], gridcolor: 'rgba(163,177,198,0.3)', title: 'RSI' },
                yaxis4: { domain: [0, .16], gridcolor: 'rgba(163,177,198,0.3)', title: 'Vol (%)' },
                shapes: [
                    { type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y3', y0: 70, y1: 70, line: { color: C.red, dash: 'dot', width: 1.5 } },
                    { type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y3', y0: 30, y1: 30, line: { color: C.teal, dash: 'dot', width: 1.5 } }
                ]
            }), { displayModeBar: false, responsive: true });
        }

        function drawMacro() {
            const o = mx({ fx: MS.fx / 100, wheat: MS.wheat / 100, cpo: MS.cpo / 100, bi: MS.bi, infl: MS.infl, pt: MS.pt / 100 });
            $('mxM').innerHTML = met('COGS Impact', spct(o.dcogs))

            const lab = ['Base EPS', ...Object.keys(o.comp), 'Pro Forma EPS'], val = [MB.eps, ...Object.values(o.comp), o.epsN];
            P('mw', [{
                type: 'waterfall', x: lab, y: val, measure: ['absolute', ...Object.keys(o.comp).map(() => 'relative'), 'total'],
                increasing: { marker: { color: C.teal } }, decreasing: { marker: { color: C.red } }, totals: { marker: { color: C.blue } },

            const fac = [['USD/IDR ±10%', 'fx', .10], ['Wheat Price ±20%', 'wheat', .20], ['CPO Price ±20%', 'cpo', .20], ['BI Rate ±100bps', 'bi', 100], ['Inflation ±1pp', 'infl', 1]]
                .map(([l, k, z]) => [l, mx({ [k]: z, pt: MS.pt / 100 }).depsP * 100, mx({ [k]: -z, pt: MS.pt / 100 }).depsP * 100])

            P('mt', [
                { type: 'bar', orientation: 'h', y: fac.map(f => f[0]), x: fac.map(f => f[1]), name: 'Negative Macro Shock', marker: { color: C.red } },
                { type: 'bar', orientation: 'h', y: fac.map(f => f[0]), x: fac.map(f => f[2]), name: 'Positive Macro Shock', marker: { color: C.teal } }
            ], { title: T('Tornado Chart: Relative Factor Sensitivity Ranking on EPS (%)'), barmode: 'relative', hovermode: 'closest' });
        }

        /* ========================= TAB 5: VALIDATION & DOCS ========================= */
        function research() {
            const r = D[scen], c = CP[0], pr = CP.slice(1);
            const rows = SC.map(s => `| ${s} | ${pct(D[s].a.rev_cagr)} | ${pct(D[s].a.ebit_margin)} | ${pct(D[s].a.wacc, 2)} | ${pct(D[s].a.tg)} | ${fmt(D[s].price)} | ${spct(D[s].price / LAST - 1)} |`).join('\n');

${rows}

        }

        const README = `# ICBP Equity Research & Valuation Terminal (Neumorphic Soft UI)

An institutional-grade, single-file interactive research dashboard for PT Indofood CBP Sukses Makmur Tbk (IDX: ICBP.JK).

## Features

- Macroeconomic sensitivity simulator with EPS waterfall bridge and tornado ranking.
- Automated 12-point accounting and valuation calculation audit suite.
`;

        function renderT5() {
            const checks = []; const add = (n, ok, d) => checks.push([n, ok, d]);
            const bs = Math.max(...F.ta.map((t, i) => Math.abs(t - (F.cash[i] + F.rec[i] + F.inv[i] + F.oca[i] + F.ppe[i] + F.gw[i] + F.onca[i])))),
                bs2 = Math.max(...F.ta.map((t, i) => Math.abs(t - F.liab[i] - F.eq[i])));
            add('Balance Sheet Identity: Assets == Liabilities + Equity', bs < .5 && bs2 < .5, `max discrepancy = ${Math.max(bs, bs2).toFixed(4)} bn`);
            const cd = Math.max(...[1, 2, 3, 4].map(i => Math.abs(F.cash[i] - F.cash[i - 1] - F.netchg[i])));
            add('Cash Roll-Forward Reconciliation vs Cash Flow Statement', cd < .6, `max discrepancy = ${cd.toFixed(4)} bn`);
            const idn = Math.max(...F.rev.map((r, i) => Math.abs(r - F.cogs[i] - F.gp[i])), ...F.ebit.map((e, i) => Math.abs(e + F.da[i] - F.ebitda[i])), ...F.pretax.map((p, i) => Math.abs(p - F.tax[i] - F.ni[i])));
            add('Income Statement Accounting Subtotal Identities', idn < .3, `max discrepancy = ${idn.toFixed(4)} bn`);

            const bad = Object.values(F).flat().filter(v => typeof v === 'number' && !isFinite(v)).length;
            add('Missing or Non-Finite Value Audit', bad === 0, `0 non-finite values across financial tables`);
            SC.forEach(s => {
                const r = D[s], a = r.a; let pv = 0; r.u.forEach((u, i) => pv += u / (1 + a.wacc) ** (i + 1));
                const tv = r.u[4] * (1 + a.tg) / Math.max(a.wacc - a.tg, .005), ev = pv + tv / (1 + a.wacc) ** 5, px = (ev - B.nd - B.nci) / B.shB;
                add('DCF Analytical Model Reconciliation - ' + s, Math.abs(ev - r.ev) < 1e-6 * r.ev && Math.abs(px - r.price) < 1e-6 * r.price, `EV ${fmt(r.ev)} vs ${fmt(ev)}; Price ${fmt(r.price)} vs ${fmt(px)}`);

            add('Stock Price OHLCV Integrity (High >= Open/Close, Low <= Open/Close)', PX.close.every((c, i) => PX.high[i] >= Math.max(PX.open[i], c) && PX.low[i] <= Math.min(PX.open[i], c) && PX.volume[i] > 0), `${PX.close.length} daily bars validated`);

            const pass = checks.filter(c => c[1]).length, note = research();

                    <tbody>${checks.map(c => `<tr><td>${c[0]}</td><td class="${c[1] ? 'ok' : 'bad'}">${c[1] ? '✓ PASS' : '✗ FAIL'}</td><td>${c[2]}</td></tr>`).join('')}</tbody>
                </table>
            </div>

            <h2>Institutional Research Note &amp; Portfolio Documentation</h2>
            <div class="g2">
                <div class="box"><b style="display:block;margin-bottom:10px;">Equity Research Note (Markdown)</b><pre id="noteTxt"></pre></div>

        const TAB_LABELS = ['Executive Summary', '5Y Fundamentals', 'DCF Valuation', 'Peer Valuation', 'Technicals & Macro', 'Audit & Docs'];
        const RENDER = [renderT0, renderT1, renderT2, renderT3, renderT4, renderT5];

        function showTab(i) {
            tab = i;
            TAB_LABELS.forEach((_, k) => $('t' + k).hidden = k !== i);
            $('tabs').innerHTML = TAB_LABELS.map((n, k) => `<button class="${k === i ? 'on' : ''}" onclick="showTab(${k})">${TAB_ICONS[k]} ${n}</button>`).join('');

        function update() {

        recompute();
        renderSide();
        showTab(0);
