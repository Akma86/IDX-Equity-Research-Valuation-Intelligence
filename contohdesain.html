    <script>
        /* ========================= UTILITIES & THEME ========================= */
        const C = { teal: '#0D9488', blue: '#2563EB', amber: '#D97706', red: '#DC2626' };
        const PAL = [C.teal, C.blue, C.amber, C.red, '#7C3AED', '#64748B'];
        const $ = id => document.getElementById(id);
        const sum = a => a.reduce((x, y) => x + y, 0);
        const fmt = (v, d = 0) => Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

        const cagr = (a, b, n) => Math.pow(b / a, 1 / n) - 1;

        function L(o = {}) {

            return b
        }
        const P = (id, d, l) => Plotly.react(id, d, L(l), { displayModeBar: false, responsive: true });

        function download(name, text, mime) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; a.click() }
        function spark(a) {
            const w = 80, h = 22, mn = Math.min(...a), mx = Math.max(...a), r = mx - mn || 1;
            const p = a.map((v, i) => `${(i / (a.length - 1) * w).toFixed(1)},${(h - 2 - (v - mn) / r * (h - 4)).toFixed(1)}`).join(' ');
            return `<svg width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="#0D9488" stroke-width="1.5"/></svg>`
        }

            for (let i = 0; i < n; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) ** 2; syy += (y[i] - my) ** 2 }
            const s = sxy / sxx; return { slope: s, icpt: my - s * mx, r2: sxy * sxy / (sxx * syy) }
        }
        function quant(a, q) { const s = [...a].sort((x, y) => x - y), p = (s.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return s[lo] + (s[hi] - s[lo]) * (p - lo) }
        const median = a => quant(a, .5);

        /* ========================= SYNTHETIC DATA (mirrors app.py) ========================= */
        const FY = [2021, 2022, 2023, 2024, 2025], TAX = .22, MIN = .14, PAYOUT = .45, SH = 11661.9, SHB = SH / 1000, NCI_FV = 1.5;
        const LAST_TARGET = 9150;
        const rev = [56804, 64797, 67925, 71200, 74800];
        const gmA = [.335, .300, .340, .355, .360], opexP = [.185, .185, .185, .188, .188], daP = [.030, .031, .030, .030, .030];
        const cogs = rev.map((r, i) => r * (1 - gmA[i])), opex = rev.map((r, i) => r * opexP[i]), da = rev.map((r, i) => r * daP[i]);

        const ebit = rev.map((r, i) => r - cogs[i] - opex[i]), pretax = ebit.map((e, i) => e - intr[i] + oth[i]);
        const tax = pretax.map(p => p * TAX), ni = pretax.map((p, i) => p - tax[i]), mino = ni.map(x => x * MIN), nip = ni.map((x, i) => x - mino[i]);

        const ppe = [24500, 25800, 27000, 28400, 29800], gw = [4800, 4800, 4850, 4850, 4900];
        const pay = [4800, 5600, 5900, 6100, 6400], ocl = [5000, 5500, 5800, 6000, 6300], oncl = [8000, 8200, 8400, 8600, 8800];
        const nwcA = rev.map((_, i) => rec[i] + inv[i] + oca[i] - pay[i] - ocl[i]);
        const dnwc = nwcA.map((v, i) => i === 0 ? 450 : v - nwcA[i - 1]);
        const onc = [300, 250, 350, 300, 320];
        const cfo = ni.map((x, i) => x + da[i] - dnwc[i] + onc[i]);
        const capex = rev.map((r, i) => r * [.052, .058, .050, .048, .047][i]);

        for (let i = 1; i < 5; i++) { debt[i] = debt[i - 1] + borrow[i]; cash[i] = cash[i - 1] + netchg[i]; eq[i] = eq[i - 1] + ni[i] - div[i] }
        const std = debt.map(d => d * .13), ltd = debt.map(d => d * .87), nci = eq.map(e => e * .12);
        const liab = pay.map((_, i) => pay[i] + std[i] + ocl[i] + ltd[i] + oncl[i]);
        const onca = liab.map((l, i) => l + eq[i] - (cash[i] + rec[i] + inv[i] + oca[i] + ppe[i] + gw[i]));
        const F = {
            fy: FY, label: FY.map(y => 'FY' + y), rev, cogs, gp: rev.map((r, i) => r - cogs[i]), opex, ebit, da, ebitda: ebit.map((e, i) => e + da[i]), int: intr, oth, pretax, tax, ni, mino, nip,
            eps: nip.map(x => x / SHB), cash, rec, inv, oca, ppe, gw, onca, pay, std, ocl, ltd, oncl, debt, liab, eq, nci,
            ta: liab.map((l, i) => l + eq[i]), cfo, capex, fcf: cfo.map((x, i) => x - capex[i]), div, borrow, invO, netchg
        };
        F.effTax = F.tax.map((t, i) => t / F.pretax[i]);
        F.nopat = F.ebit.map((e, i) => e * (1 - F.effTax[i]));
        F.ic = F.debt.map((d, i) => d + F.eq[i] - F.cash[i]);
        F.roic = F.nopat.map((n, i) => n / F.ic[i]);
        F.eqP = F.eq.map((e, i) => e - F.nci[i]);
        F.roe = F.nip.map((n, i) => n / F.eqP[i]);
        F.gm = F.gp.map((g, i) => g / rev[i]); F.em = F.ebit.map((e, i) => e / rev[i]); F.dm = F.ebitda.map((e, i) => e / rev[i]); F.nm = F.ni.map((n, i) => n / rev[i]);
        F.pm = F.nip.map((n, i) => n / rev[i]); F.at = rev.map((r, i) => r / F.ta[i]); F.emul = F.ta.map((t, i) => t / F.eqP[i]);
        F.nd = F.debt.map((d, i) => d - F.cash[i]); F.ndE = F.nd.map((n, i) => n / F.ebitda[i]); F.de = F.debt.map((d, i) => d / F.eq[i]);
        F.icov = F.ebit.map((e, i) => e / F.int[i]);
        F.dso = F.rec.map((r, i) => r / rev[i] * 365); F.dio = F.inv.map((v, i) => v / cogs[i] * 365); F.dpo = F.pay.map((p, i) => p / cogs[i] * 365);
        F.ccc = F.dso.map((d, i) => d + F.dio[i] - F.dpo[i]);
        F.ocfNi = F.cfo.map((c, i) => c / F.ni[i]); F.ocfE = F.cfo.map((c, i) => c / F.ebitda[i]); F.fcfm = F.fcf.map((f, i) => f / rev[i]);
        F.dps = F.div.map(d => d / SHB); F.bvps = F.eqP.map(e => e / SHB);
        const K = 4; // last index

        /* segments & geography */
        const SEGN = ['Noodles', 'Dairy', 'Snack Foods', 'Food Seasonings', 'Nutrition & Special Foods', 'Beverages'];
        const SEGS = {
            Noodles: [.700, .695, .690, .686, .682], Dairy: [.115, .118, .120, .122, .124], 'Snack Foods': [.045, .046, .047, .048, .049],
            'Food Seasonings': [.055, .056, .057, .058, .059], 'Nutrition & Special Foods': [.045, .046, .047, .048, .049]
        };
        SEGS.Beverages = FY.map((_, i) => 1 - ['Noodles', 'Dairy', 'Snack Foods', 'Food Seasonings', 'Nutrition & Special Foods'].reduce((a, k) => a + SEGS[k][i], 0));
        const MEA = [.115, .120, .125, .128, .132];

        /* prices */
        function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
        const R = rng(42), randn = () => { let u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()) };
        const PX = (() => {
            const N = 1000, dates = []; let d = new Date(Date.UTC(2026, 10, 10));
            while (dates.length < N) { if (d.getUTCDay() % 6 !== 0) dates.push(d.toISOString().slice(0, 10)); d = new Date(d.getTime() - 864e5) }
            dates.reverse();
            const r = [], cum = []; let c = 0; for (let i = 0; i < N; i++) { r.push(randn() * .011 * (1 + .4 * Math.sin(i / 55))); c += r[i]; cum.push(c) }

                const close = cl[i] * sc, prev = i ? cl[i - 1] * sc : close, op = prev * (1 + randn() * .004);

            }
            const ret = close.map((x, i) => i ? x / close[i - 1] - 1 : 0), vol = close.map((_, i) => {
                if (i < 30) return null; const s = ret.slice(i - 29, i + 1), m = sum(s) / 30;
                return Math.sqrt(sum(s.map(x => (x - m) ** 2)) / 29) * Math.sqrt(252) * 100
            });

        })();
        const LAST = PX.close[PX.close.length - 1];

        /* peers */
        const PEERS = [['INDF', 62, 7.5, 7.0, 4.8, .90, 12.5, 14.0, 4.2, 6.0], ['MYOR', 52, 18, 16, 10.5, 3.3, 18.5, 9.5, 1.4, 9.0], ['ULTJ', 18, 14, 12.5, 7.8, 2.6, 18, 13, 2.5, 8.0],
        ['UNVR', 58, 17, 16, 11, 14.5, 82, 17, 5.5, 2.0], ['CMRY', 28, 21, 18.5, 13.5, 5.5, 28, 20, 2.1, 12.0]]
            .map(r => ({ t: r[0], mcap: r[1], pe: r[2], pef: r[3], ev: r[4], pbv: r[5], roe: r[6], opm: r[7], dy: r[8], eg: r[9] }));

        /* ========================= MODELS ========================= */
        const B = {
            rev: F.rev[K], m: F.ebit[K] / F.rev[K], daP: F.da[K] / F.rev[K], nwcP: (F.rec[K] + F.inv[K] + F.oca[K] - F.pay[K] - F.ocl[K]) / F.rev[K],

                dn = rv.map((r, i) => (r - (i ? rv[i - 1] : B.rev)) * B.nwcP), u = np.map((n, i) => n + d[i] - cx[i] - dn[i]),
                pv = u.map((x, i) => x / (1 + a.wacc) ** (i + 1)), tv = u[4] * (1 + a.tg) / Math.max(a.wacc - a.tg, .005), pvtv = tv / (1 + a.wacc) ** 5,
